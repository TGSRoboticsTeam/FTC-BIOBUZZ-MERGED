repositories {
    mavenCentral()
    google() // Needed for androidx

    maven { url 'https://repo.dairy.foundation/releases/'} // pedro pathing

    maven { url = 'https://maven.brott.dev/' } // amcrobotics
    maven { url = 'https://maven.pedropathing.com' } // pedropathing
    maven { url = "https://mymaven.bylazar.com/releases" } // pedropathing tuning
    maven { url = 'https://maven.pedropathing.com' } // isn't this redundant? "well, if it works, DON'T TOUCH IT!"
    maven { url = "https://mymaven.bylazar.com/releases" } // okay, this is definitely redundant...
    maven { url 'https://jitpack.io' }
    // Add this line
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    // pedropathing
    implementation 'com.pedropathing:ftc:2.0.1'
    implementation 'com.pedropathing:telemetry:0.0.6'
//    implementation "com.bylazar:panels:1.0.3"
    implementation("com.pedropathing:core:2.0.5")

    // pedropathing tuning
//    implementation 'com.bylazar:fullpanels:1.0.6'
//    implementation "com.bylazar:telemetry:1.0.3"

    implementation 'com.pedropathing:revhub:3.0.1'
    implementation 'com.pedropathing:tuning:1.0.1'

    implementation 'com.pedropathing.ivy:pedro:1.1.1'

    // amcrobotics
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.acmerobotics.dashboard:dashboard:0.4.16'
}